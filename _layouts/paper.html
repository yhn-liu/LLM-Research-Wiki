<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; line-height: 1.8; color: #333; max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { color: #1a1a2e; border-bottom: 3px solid #0f3460; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.6em; }
    h2 { color: #16213e; margin-top: 30px; margin-bottom: 15px; font-size: 1.3em; }
    h3 { color: #0f3460; margin-top: 20px; }
    a { color: #0f3460; text-decoration: none; border-bottom: 1px dashed #0f3460; }
    a:hover { color: #e94560; border-bottom-color: #e94560; }
    .paper-meta { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .paper-meta p { margin: 5px 0; }
    .tag { display: inline-block; background: #0f3460; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
    pre { background: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 15px 0; }
    code { background: #f8f9fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    blockquote { border-left: 4px solid #e94560; padding: 10px 15px; color: #666; margin: 15px 0; background: #fef6f8; border-radius: 0 8px 8px 0; }
    ul, ol { padding-left: 25px; margin: 10px 0; }
    li { margin: 5px 0; }
    hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
    nav { margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #eee; display: flex; gap: 15px; align-items: center; }
    nav a { border-bottom: none; font-weight: 500; }
    .related-section { background: #f0f4ff; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #d0d9f0; }
    .related-section h2 { border-bottom: none; font-size: 1.1em; margin-top: 0; }
    @media (max-width: 600px) { body { padding: 10px; } }
  </style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">📚 首页</a>
    <span style="color:#ccc">|</span>
    <a href="{{ site.baseurl }}/concepts/large-language-model.html">大语言模型</a>
    <a href="{{ site.baseurl }}/concepts/reinforcement-learning.html">强化学习</a>
    <a href="{{ site.baseurl }}/concepts/multimodal-learning.html">多模态</a>
  </nav>
  <article class="paper-content">
    {{ content }}
  </article>
</body>
</html>
