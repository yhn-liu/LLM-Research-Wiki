<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; line-height: 1.8; color: #333; max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { color: #1a1a2e; border-bottom: 3px solid #0f3460; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.6em; }
    h2 { color: #16213e; margin-top: 30px; margin-bottom: 15px; font-size: 1.3em; }
    h3 { color: #0f3460; margin-top: 20px; }
    a { color: #0f3460; text-decoration: none; border-bottom: 1px dashed #0f3460; }
    a:hover { color: #e94560; border-bottom-color: #e94560; }
    a.concept-exists { color: #0f3460; border-bottom: 2px solid #0f3460; font-weight: 500; }
    a.concept-exists:hover { color: #e94560; border-bottom-color: #e94560; }
    a.concept-stub { color: #e94560; border-bottom: 2px dashed #e94560; opacity: 0.8; }
    a.concept-stub:hover { opacity: 1; background: #fff3f3; border-radius: 3px; }
    .concept-stub-badge { font-size: 0.7em; background: #e94560; color: white; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
    .paper-meta { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .paper-meta p { margin: 5px 0; }
    .tag { display: inline-block; background: #0f3460; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
    pre { background: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 15px 0; }
    code { background: #f8f9fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
    mjx-container[display="true"] { margin: 1em 0; padding: 0.5em 0; }
    .math-inline { white-space: nowrap; }
    blockquote { border-left: 4px solid #e94560; padding: 10px 15px; color: #666; margin: 15px 0; background: #fef6f8; border-radius: 0 8px 8px 0; }
    ul, ol { padding-left: 25px; margin: 10px 0; }
    li { margin: 5px 0; }
    hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
    nav { margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #eee; display: flex; gap: 15px; align-items: center; }
    nav a { border-bottom: none; font-weight: 500; }
    .paper-figure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 18px 0; }
    .paper-figure-grid figure { margin: 0; padding: 12px; border: 1px solid #e4e7ec; border-radius: 12px; background: #fbfcff; box-shadow: 0 3px 12px rgba(15,52,96,0.07); }
    .paper-figure-grid img { width: 100%; max-height: 360px; object-fit: contain; display: block; margin: 0 auto; }
    .paper-figure-grid figcaption { margin-top: 8px; color: #667085; font-size: 0.9em; text-align: center; }
    @media (max-width: 600px) { body { padding: 10px; } }
  </style>
  <script>
    window.normalizeWikiMath = function(root) {
      root = root || document.body;
      var skipTags = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'PRE', 'CODE', 'A', 'MJX-CONTAINER']);
      var mathPattern = /([A-Z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)?\s*=\s*[A-Za-z0-9]+(?:_[A-Za-z0-9]+)?(?:\s*,\s*[A-Z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)?\s*=\s*[A-Za-z0-9]+(?:_[A-Za-z0-9]+)?)+)/g;
      function texify(expr) {
        return expr
          .replace(/([A-Za-z])_([A-Za-z0-9]+)/g, '$1_{$2}')
          .replace(/\s*=\s*/g, '=')
          .replace(/\s*,\s*/g, ',\\; ');
      }
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          var parent = node.parentElement;
          if (!parent || skipTags.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
          if (parent.closest('pre, code, script, style, textarea, a, mjx-container')) return NodeFilter.FILTER_REJECT;
          if (!mathPattern.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
          mathPattern.lastIndex = 0;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function(node) {
        var frag = document.createDocumentFragment();
        var text = node.nodeValue;
        var last = 0;
        text.replace(mathPattern, function(match, expr, offset) {
          if (offset > last) frag.appendChild(document.createTextNode(text.slice(last, offset)));
          var span = document.createElement('span');
          span.className = 'math-inline';
          span.textContent = '\\(' + texify(expr) + '\\)';
          frag.appendChild(span);
          last = offset + match.length;
        });
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag, node);
      });
    };
    window.MathJax = {
      loader: { load: ['[tex]/ams', '[tex]/noerrors', '[tex]/noundefined'] },
      tex: {
        packages: { '[+]': ['ams', 'noerrors', 'noundefined'] },
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true,
        processEnvironments: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: {
        pageReady: function() {
          window.normalizeWikiMath(document.body);
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">📚 首页</a>
    <span style="color:#ccc">|</span>
    <a href="{{ site.baseurl }}/concepts/large-language-model.html">大语言模型</a>
    <a href="{{ site.baseurl }}/concepts/reinforcement-learning.html">强化学习</a>
    <a href="{{ site.baseurl }}/concepts/multimodal-learning.html">多模态</a>
    <a href="{{ site.baseurl }}/concepts/world-models.html">世界模型</a>
  </nav>
  <article class="paper-content">
    {{ content }}
  </article>
  <script>
  (function() {
    var existing = ["ai-agents","ai-safety-alignment","autonomous-driving","benchmarking","graph-neural-networks","knowledge-distillation","large-language-model","medical-ai","multimodal-learning","reinforcement-learning","world-models"];
    document.querySelectorAll('a[href*="concepts/"]').forEach(function(a) {
      var match = a.href.match(/concepts\/([a-z0-9-]+)\.html/);
      if (match) {
        var slug = match[1];
        if (existing.indexOf(slug) !== -1) {
          a.classList.add('concept-exists');
        } else {
          a.classList.add('concept-stub');
          var badge = document.createElement('span');
          badge.className = 'concept-stub-badge';
          badge.textContent = '建设中';
          a.appendChild(badge);
        }
      }
    });
  })();
  </script>
</body>
</html>
