<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.8; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; }
    h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
    h2 { color: #2980b9; margin-top: 30px; margin-bottom: 15px; }
    h3 { color: #2c3e50; margin-top: 20px; }
    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .stats { background: #ecf0f1; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .tag { display: inline-block; background: #3498db; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #3498db; color: white; }
    tr:hover { background: #f5f5f5; }
    pre { background: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 15px 0; }
    code { background: #f8f9fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #3498db; padding-left: 15px; color: #666; margin: 15px 0; }
    ul, ol { padding-left: 25px; margin: 10px 0; }
    li { margin: 5px 0; }
    .paper-meta { background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .paper-meta p { margin: 5px 0; }
    .paper-content { line-height: 1.8; }
    .paper-content h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
    nav { margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #eee; }
    nav a { margin-right: 15px; }
  </style>
</head>
<body>
  <nav>
    <a href="/LLM-Research-Wiki/">首页</a>
  </nav>
  {{ content }}
</body>
</html>
